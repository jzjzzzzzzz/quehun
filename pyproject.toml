[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["test"]
pythonpath = ["."]
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  ".venv_windows_bak_*",
  "build",
  "dataset",
  "debug",
  "dist",
  "templates",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
